  <p style="font-size:11px;">
    tamaño texto:<br>
    <a href="#" onclick="setSize(0); return false;">[ A ]</a>
    <a href="#" onclick="setSize(1); return false;">[ A+ ]</a>
    <a href="#" onclick="setSize(2); return false;">[ A++ ]</a>
  </p>

  <script>
    (function () {
      const sizes = ['13px', '15px', '17px'];
      let idx = 0;

      function apply() {
        const main = window.parent.frames['main'];
        if (main && main.document && main.document.body) {
          main.document.body.style.fontSize = sizes[idx];
          main.document.body.style.lineHeight = '1.45';
        }
      }

      const mainFrame = window.parent.frames['main'];
      if (mainFrame) {
        if (mainFrame.document.readyState === 'complete') apply();
        mainFrame.addEventListener('load', apply);
      }

      window.setSize = function (n) {
        idx = n;
        apply();
      };
    })();
  </script>
