<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>top</title>
</head>
<body style="margin:0; padding:12px; background:#000; color:#fff; font-family:'Courier New',Courier,monospace; overflow:hidden;">
  <table width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
      <td valign="top">
        <h1 style="margin:0; font-size:20px;">jrr.petciclo.cl</h1>
        <p style="margin:6px 0 0; font-size:13px;">Javier Rodríguez Ruiz — Ingeniero, inventor, Debian.</p>
      </td>
      <td align="right" valign="middle" style="font-size:12px; color:#fff;">
        texto:
        <a href="#" onclick="setSize(0); return false;" style="color:#fff;">[ A ]</a>
        <a href="#" onclick="setSize(1); return false;" style="color:#fff;">[ A+ ]</a>
        <a href="#" onclick="setSize(2); return false;" style="color:#fff;">[ A++ ]</a>
      </td>
    </tr>
  </table>

  <script>
    (function () {
      const scales = ['1', '1.15', '1.3'];
      let idx = 0;

      function apply() {
        document.body.style.zoom = scales[idx];
        ['menu', 'main', 'footer'].forEach(function (name) {
          const f = window.parent.frames[name];
          if (f && f.document && f.document.body) {
            f.document.body.style.zoom = scales[idx];
          }
        });
      }

      window.setSize = function (n) {
        idx = n;
        apply();
      };

      apply();
    })();
  </script>
</body>
</html>
