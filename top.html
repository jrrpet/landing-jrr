<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>top</title>
</head>
<body style="margin:0; padding:12px; background:#000; color:#fff; font-family:'Courier New',Courier,monospace; overflow:hidden;">
  <table width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
      <td valign="top">
        <h1 style="margin:0; font-size:24px;">jrr.petciclo.cl</h1>
        <p style="margin:6px 0 0; font-size:15px;">Javier Rodríguez Ruiz — Ingeniero, inventor, Debian.</p>
      </td>
      <td align="right" valign="middle" style="font-size:14px; color:#fff;">
        texto:
        <a href="#" onclick="setZoom('1'); return false;" style="color:#fff;">[ A ]</a>
        <a href="#" onclick="setZoom('1.15'); return false;" style="color:#fff;">[ A+ ]</a>
        <a href="#" onclick="setZoom('1.3'); return false;" style="color:#fff;">[ A++ ]</a>
      </td>
    </tr>
  </table>

  <script src="zoom.js"></script>
  <script>
    function setZoom(value) {
      localStorage.setItem('jrr-zoom', value);
      document.body.style.zoom = value;
      ['menu', 'main', 'footer'].forEach(function (name) {
        const f = window.parent.frames[name];
        if (f) {
          f.postMessage({ type: 'zoom', value: value }, '*');
        }
      });
    }
  </script>
</body>
</html>
